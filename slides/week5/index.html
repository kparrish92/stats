# Linear Regression



.pull-left[
.large[
So far, we have been focusing on **comparing two means** (e.g. is class A better than class B at math).
]
]

--

.pull-right[
.large[
But what about .red[confounding variables?]

What if the differences in math scores between two schools are not simply because one school is better, but because of another variable (socio-economic status)?

For this we can use a linear model - specifically a multivariate linear regression. 

It can consider several variables at once! 
]]

---

# What are models?  

.large[
&gt; "All models are wrong, but some are useful." &lt;br&gt;&lt;br&gt;
George Box

]

.large[
**Models** simplify reality for purposes of understanding or prediction.  
]

--

.large[

Statistical modeling has these two sometimes divergent goals:

- .green[*Description*]: using a model to describe the relationship between an outcome variable of interest and one or more predictor variables.


- .red[*Prediction*]: using a model to predict unknown instances of the outcome variable such that out-of-sample predictive error is minimized.
]

---

# The basics

.pull-left[
.large[
A linear model is *parametric* because we assume that the relationship between two variables is linear and can be defined by the *parameters* of a line---an .green[intercept] and .red[slope].  We'll start by considering a simple linear model.
]]

--

.pull-right[

]

# Simple linear model

.large[
A simple linear model has an outcome, `\(y\)`, and one predictor, `\(x\)`. 

`$$y = mx + b$$`
]


--

We often want to *predict* or *describe* the outcome .blue[y] as a function of the predictor .red[x].

--

.large[
**Examples**

.blue[weight] ~ .red[height]

.blue[IQ] ~ .red[age]

.blue[ice cream sold] ~ .red[temperature]

.blue[RT] ~ .red[group]
]

---

# Linear algebra 

*mx* is the *slope* and .blue[b] is the point where the line crosses the y-axis when x = 0, i.e. the *y-intercept*.

If you know two of the variables, you can solve for the third... 
assume x = 2. Solve for y.

--

`$$y = 50 + 10x$$`

--

`$$y = 50 + 10 \times 2$$`

--

`$$y = 50 + 20$$`

--

`$$y = 70$$`

# Bivariate regression

The linear model is basically the same as linear algebra, with two subtle differences
  1. We fit the line through data points (measurements, observations)
  2. We use slightly different terminology


`$$\color{blue}{response} \sim intercept + (slope * \color{red}{predictor})$$`

`$$\color{blue}{\hat{y}} = a + b\color{red}{x}$$`

--

- We call our dependent variable the .blue[outcome variable] (or criterion)
- Our independent variables are called .red[predictors]
- The intercept and the slope are *coefficients*
  - These are the meat and potatoes of the linear model
  - They are also called *parameter estimates*

# Bivariate regression

### Measurement error

.pull-left[
- We rarely (never) find a perfectly linear relationship in our data
  - Most relationships are not perfectly linear
  - Our measurements are not perfect (VOT, formants, durations, RT)
  - There is error in everything (normal distribution)
- We account for *error* in our models]


### `$$\hat{y} = a + bx + \color{red}{\epsilon}$$`

---

# Bivariate regression

### Measurement error

.pull-left[
&lt;img src="index_files/figure-html/best_fit4-1.png" width="432" /&gt;
]

.pull-right[
- Again, we can see that the .blue[mean of `y`] isn't the best solution. 
  - It can summarize the `y` data
  - It cannot explain the relationship between `x` and `y`.
- We need a method to assess how well a given line fits the data
- We need a method to determine the optimal intercept and slope (the line of best fit)
]

---

# Bivariate regression

### More on error

&lt;img src="index_files/figure-html/unnamed-chunk-14-1.png" width="33%" /&gt;&lt;img src="index_files/figure-html/unnamed-chunk-14-2.png" width="33%" /&gt;&lt;img src="index_files/figure-html/unnamed-chunk-14-3.png" width="33%" /&gt;

- One way to do this is to calculate the 'distance' between predicted y (ŷ, y-hat) and observed y ($y_i$). 
- If we add up this distance for each observation we can compare it to other lines (i.e., other distances). 
- The line that produces the shortest distance is the best. 


---

# Bivariate regression

### More on error

.pull-left[
&lt;img src="index_files/figure-html/best_fit6-1.png" width="432" /&gt;
]

.pull-right[
- The difference between `\(\hat{y}\)` and `\(y_i\)` is called *prediction error*
- The *total prediction error* (TPE) is the sum of the prediction error of all observations
- This measurement is not ideal because negative values cancel out the positive ones, thus we square them. 
- We call this the sum of square of the errors (SSE)
]

# Bivariate Regression

### Least squares estimation

&lt;br&gt;

`$$b = \frac{\sum{(x_i - \bar{x})(y_i - \bar{y})}}{\sum{(x_i - \bar{x})^2}}$$`
--

`$$a = \bar{y} - b\bar{x}$$`

# Bivariate Regression 


- The *best fit line* is determined using the **ordinary least squares** method 

- In other words, we try to find the best line that minimizes 
the .green[distance] between the *predicted values* (the line, `\(\color{red}{\hat{y}}\)`) and the observed data, `\(\color{blue}{y_{i}}\)`
- The .green[distances] representing deviations from the regression line are called **residuals**.

- The best fit line is the one that reduces the *sum of squares* of the error term (this is a measure of the variability around the best fit line)

- We never measure anything perfectly... there is &lt;u&gt;always&lt;/u&gt; error


---

# Fitting a model

`$$y_i = \beta_0 + \beta_1 X_i + \epsilon_i$$`

- Coefficients (parameter estimates)
  - `\(\beta_0\)`: intercept
  - `\(\beta_1\)`: slope 
- `\(\epsilon\)`: error

We will again use the `mtcars` dataset.

---

# Get to know the dataset

- Using the `mtcars` dataset, we can fit a model with the 
following variables:
  - **response variable**: `mpg`
  - .blue[predictor]: `wt`

```{webr-r}
#| label: webr-mtcars-str
str(mtcars)
```

# Fitting the model 

.pull-left[
- We will fit the model using the linear equation...  
`$$mpg_i = \beta_0 + \beta_1 wt_i + \epsilon_i$$`
- To do this in R, we use the `lm()` function
- `lm()` will use the *ordinary least squares* method to obtain 
parameter estimates, i.e., β&lt;sub&gt;0&lt;/sub&gt; (intercept) and 
β&lt;sub&gt;1&lt;/sub&gt; (slope)
- In essence, it will estimate the parameters we need to predict 
`mpg` for a given `weight`
]

.pull-right[

```
#&gt; 
#&gt; Call:
#&gt; lm(formula = mpg ~ wt, data = mtcars)
#&gt; 
#&gt; Coefficients:
#&gt; (Intercept)           wt  
#&gt;      37.285       -5.344
```
]

- Ranges from 0 to 1 (1 = 100% variance explained)

## Making predictions

Recall the linear model equation...

`$$\hat{y} = \beta_0 + \beta_1 wt_i + \epsilon_i$$`

- Our `mtcars` model can be summarized as...

`$$mpg = 37.29 + -5.34 wt$$`


- What is the predicted `mpg` for a car that weighs 1 unit? And one that weighs 3? And 6?

--

31.94 `\(mpg = 37.29 + -5.34 \times 1\)`

21.25 `\(mpg = 37.29 + -5.34 \times 3\)` 

5.22 `\(mpg = 37.29 + -5.34 \times 6\)`
